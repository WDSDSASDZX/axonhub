services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8091:8091"
    env_file:
      - ${AXON_ENV_FILE:-.env}
    volumes:
      - python_data:/app/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  python_data:
