[project]
name = "axonhub-python"
version = "0.1.0"
description = "A small asynchronous AI gateway inspired by AxonHub"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "anyio>=4,<5",
  "cryptography>=44",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axonhub"]

[project.scripts]
axonhub = "axonhub.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
