name: Python gateway

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/python.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/python.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - if: matrix.python == '3.12'
        run: docker build -t axonhub-python:ci .
